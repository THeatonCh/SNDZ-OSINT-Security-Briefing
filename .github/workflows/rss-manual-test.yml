name: RSS Manual Publication Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-publication
  cancel-in-progress: false

jobs:
  publish-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add harmless RSS test item
        shell: python
        run: |
          from datetime import datetime, timezone
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("feed.xml")
          tree = ET.parse(path)
          root = tree.getroot()
          channel = root.find("channel")
          if root.tag != "rss" or channel is None:
              raise RuntimeError("Unexpected RSS structure; feed left unchanged")

          now = datetime.now(timezone.utc)
          identifier = "github-actions-test-" + now.strftime("%Y%m%dT%H%M%SZ")
          item = ET.Element("item")
          ET.SubElement(item, "title").text = "RSS automation test - " + now.strftime("%Y-%m-%d %H:%M UTC")
          ET.SubElement(item, "description").text = "Harmless public test item generated by a manually triggered GitHub Actions workflow. No operational intelligence."
          ET.SubElement(item, "guid", {"isPermaLink": "false"}).text = identifier
          ET.SubElement(item, "pubDate").text = now.strftime("%a, %d %b %Y %H:%M:%S GMT")
          channel.insert(4, item)
          ET.indent(tree, space="  ")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          ET.parse(path)
          print("Created", identifier)

      - name: Commit and push feed update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git commit -m "Publish manually triggered RSS automation test"
          git push
